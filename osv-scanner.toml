# OSV fail-closed 扫描（security.yml osv job）的显式豁免——续删从严：
# 每条豁免须在注释里写明不可修的理由与复核触发器。
[[PackageOverrides]]
# braces 3.0.3 ReDoS（GHSA-vfj7-8cjw-p6xm）：上游停更无修复版可升；仅在
# dev/构建链（fast-glob→micromatch→braces，shadcn CLI 等），不进运行时
# bundle。复核触发器：braces 发修复版或链路可弃时删除本条。
ecosystem = "npm"
name = "braces"
version = "3.0.3"
ignore = true

[[PackageOverrides]]
# virtualenv 21.14.5 残余 4 条（GHSA-vxj4 修 21.14.7；GHSA-43mp/c978/cw65
# 修 21.14.9）：≥21.14.6 全线要求 packaging>=26.3，被 prefect（≤3.6.28.dev5
# 全线）packaging<26.1 上界压死——21.14.5 是当前可解析天花板。纯 dev 链
# （pre-commit 建 venv 用），不进应用运行时。复核触发器：prefect 放开
# packaging 上界、或 virtualenv 出兼容 packaging<26 的修复版时删除本条。
ecosystem = "PyPI"
name = "virtualenv"
version = "21.14.5"
ignore = true

[[PackageOverrides]]
# zod 3.25.76（GHSA-mrhx-c7xc-m3w5，8.2）：修版仅 4.6.6，但四个上游父件
# （@ag-ui/client+proto、@modelcontextprotocol/sdk、shadcn）全部钉 ^3 且
# 最新版未迁 zod4——无范围内修版，盲 override 碎运行时。研究栈非公开
# SaaS，暴露面有限。复核触发器：任一父件发 zod4 线版本即删本条升级。
ecosystem = "npm"
name = "zod"
version = "3.25.76"
ignore = true

[[PackageOverrides]]
# deepmerge 4.3.1（GHSA-gcqx-w48m-w2h4，low：mergeObject() 返回对象原型
# 污染）：公告全域 >=4.2.0 <=4.3.1 且 first_patched_version=null——4.3.1
# 即最新版，无任何修版可升。仅 dev/CLI 链（shadcn CLI、@shadcn/registry），
# 不进运行时 bundle，不触不可信输入合并。复核触发器：deepmerge 发修
# 复版（或上游迁 5.x）即删本条升级。
ecosystem = "npm"
name = "deepmerge"
version = "4.3.1"
ignore = true
