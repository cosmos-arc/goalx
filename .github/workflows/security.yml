name: Security

on:
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks full-history scan
        run: |
          docker run --rm \
            --network none \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo:ro" \
            --workdir /repo \
            docker.io/zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --exit-code 1 --log-opts=--all .

  codeql:
    name: CodeQL (${{ matrix.language }})
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # v4 起 config 收内联 YAML（路径字符串会报 Cannot create property 'queries'）
          config: |
            paths_exclude:
              - apps/backend/tests/fixtures/**
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:${{ matrix.language }}"

  osv:
    name: OSV lockfile scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: OSV fail-closed recursive scan
        run: |
          docker run --rm \
            --env HOME=/tmp \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/src:ro" \
            --workdir /src \
            ghcr.io/google/osv-scanner:v2.5.1@sha256:8108ae94eadea5a02c9bec6e646909d5b790b44bd62d7f5b7f0b1d6d0ffc7734 \
            scan source --recursive ./

  security-gate:
    name: Security gate
    if: ${{ always() }}
    needs: [gitleaks, codeql, osv]
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require every security job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          failures = {name: result.get("result") for name, result in needs.items() if result.get("result") != "success"}
          if failures:
              raise SystemExit(f"security fail-closed: {failures}")
          PYTHON
