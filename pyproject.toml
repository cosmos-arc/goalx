# pyproject.toml

[project]
name = "goalx-workspace"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
description = "GoalX monorepo (FastAPI backend + React web)"

dependencies = [
    "goalx-backend",
]

[dependency-groups]
dev = [
    "ruff==0.15.11",
    "basedpyright>=1.29,<2",
    "pre-commit>=4.0,<5",
    "pytest>=9.0,<10",
    "pytest-cov>=7.0,<8",
    "pytest-asyncio>=1.0,<2",
    "pytest-mock>=3.14,<4",
    "pytest-xdist>=3.6,<4",
    "pytest-timeout>=2.3,<3",
    "inline-snapshot>=0.10,<1",
    "hypothesis>=6.100,<7",
    "respx>=0.21,<1",
    "coverage>=7.6,<8",
]

[tool.uv]
required-version = "==0.12.13"
package = false
# uv still builds first-party workspace/editable packages; block third-party sdists.
no-build = true
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython' and platform_python_implementation == 'CPython'",
    "sys_platform == 'darwin' and platform_machine == 'arm64' and implementation_name == 'cpython' and platform_python_implementation == 'CPython'",
    "sys_platform == 'win32' and platform_machine == 'AMD64' and implementation_name == 'cpython' and platform_python_implementation == 'CPython'"
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython' and platform_python_implementation == 'CPython'",
    "sys_platform == 'darwin' and platform_machine == 'arm64' and implementation_name == 'cpython' and platform_python_implementation == 'CPython'",
    "sys_platform == 'win32' and platform_machine == 'AMD64' and implementation_name == 'cpython' and platform_python_implementation == 'CPython'"
]
python-preference = "only-managed"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.workspace]
members = ["apps/backend"]

[tool.uv.sources]
goalx-backend = { workspace = true }


# ===================================================================
# Ruff (Linter + Formatter)
# 负责：代码风格检查、自动格式化、导入排序、坏味道重构等。
# ===================================================================
[tool.ruff]
required-version = ">=0.6.0"
line-length = 88
target-version = "py313"

src = ["apps/backend/src", "apps/backend/tests"]

exclude = [
    ".direnv",
    ".eggs",
    ".git",
    ".hypothesis",
    ".nox",
    ".pants.d",
    ".pytest_cache",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "node_modules",
    "venv",
]

cache-dir = ".ruff_cache"
respect-gitignore = true
force-exclude = true

# --- Ruff Linter (检查器) 配置 ---
[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "C90",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "SIM",
    "PTH",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "RUF",
    "D",
    "PT",
    "ANN",
    "S",
    "T20",
]

ignore = [
    "B008",   # 允许函数调用作为默认参数（FastAPI Depends）
    "N818",   # 异常基类命名是设计选择
    "RUF002", # 中文标点符号
    "RUF003", # 中文注释标点符号
    "D203",   # 与 formatter 冲突
    "D212",   # 与 formatter 冲突
    "D100",   # 模块必须有文档字符串
    "D107",   # __init__ 文档字符串
    "D400",   # 文档字符串句号结尾（中文不适用）
    "D415",   # 文档字符串首行标点
    "D401",   # 祈使语气
    "PT011",  # pytest.raises match 参数
    "SIM105", # contextlib.suppress
    "SIM117", # 嵌套 with 语句
]

[tool.ruff.lint.per-file-ignores]
# 测试文件 - 最宽松（所有 tests/ 目录通用）
"**/tests/**/*.py" = [
    "PLR2004",
    "PLR0913",
    "S101",
    "S106",
    "S311",
    "S608",
    "ANN",
    "D",
    "PLC0415",
    "C901",
    "S105",
    "S108",
    "S110",
]
"**/conftest.py" = ["ANN", "D", "PLC0415"]

# __init__.py
"__init__.py" = ["D104"]

# --- Ruff Formatter (格式化器) 配置 ---
[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.inline-snapshot]
format-command = "ruff format --stdin-filename {filename}"

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true
suppress-dummy-args = true

[tool.ruff.lint.pylint]
max-statements = 50
max-args = 7
max-branches = 12
max-returns = 6

[tool.ruff.lint.mccabe]
max-complexity = 10

# ===================================================================
# BasedPyright (类型检查) - Pyright fork，更严格的默认设置
# ===================================================================
[tool.basedpyright]
pythonVersion = "3.13"
pythonPlatform = "All"

venvPath = "."
venv = ".venv"

typeCheckingMode = "standard"

include = ["apps/backend/src"]

exclude = [
    "**/__pycache__",
    "**/node_modules",
    ".venv",
    "build",
    "dist",
    "tests",
    "**/tests",
]

strict = ["apps/backend/src"]

# 让 Ruff 管风格，Pyright 专注类型
reportUnusedImport = "none"
reportUnusedVariable = "none"
reportMissingTypeStubs = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitStringConcatenation = "error"

extraPaths = [
    "apps/backend/src",
]

# ===================================================================
# Pytest (测试框架)
# ===================================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["apps/backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = [
    ".",
    "apps/backend/src",
]

filterwarnings = ["error", "ignore::UserWarning", "ignore::DeprecationWarning"]

markers = [
    "unit: Mark test as a unit test",
    "integration: Mark test as an integration test",
    "e2e: Mark test as an end-to-end test",
    "slow: Mark test as slow running (skip with -m 'not slow')",
    "serial: Mark test that must run serially",
    "snapshot: Mark test that uses inline-snapshot (must run serially)",
]

log_cli = true
log_cli_level = "INFO"
asyncio_mode = "strict"

addopts = [
    "-ra",
    "-v",
    "--import-mode=importlib",
    "-n", "auto",           # 默认并行运行
    "--dist", "loadfile",   # 同文件测试串行（避免 snapshot 冲突）
    "--strict-markers",
    "--strict-config",
    "--durations=10",       # 报告最慢的 10 个测试
]

# ===================================================================
# Importlinter (ADR-0008 方向执法；task lint 执行)
# ===================================================================
[tool.importlinter]
root_package = "goalx_backend"

[[tool.importlinter.contracts]]
name = "领域分层（ADR-0008）：shared < data < modelling < betting < evaluation < ingest < api/tasks < main < cli/flows"
type = "layers"
layers = [
    "goalx_backend.cli | goalx_backend.flows | goalx_backend.export_openapi",
    "goalx_backend.main",
    "goalx_backend.api | goalx_backend.tasks | goalx_backend.server",
    # ingest 是采集用例编排（可用 modelling/betting/data；与 api/tasks 同级语义）
    "goalx_backend.data.ingest",
    "goalx_backend.evaluation",
    "goalx_backend.betting",
    "goalx_backend.modelling",
    "goalx_backend.data.today",
    "goalx_backend.data.results | goalx_backend.data.quote_evidence | goalx_backend.data.observations",
    "goalx_backend.data.fixtures",
    "goalx_backend.db | goalx_backend.settlement",
    "goalx_backend.config | goalx_backend.markets | goalx_backend.odds_math | goalx_backend.models",
]

# ===================================================================
# Coverage
# ===================================================================
[tool.coverage.run]
branch = true
source = [
    "apps/backend/src/goalx_backend",
]
omit = [
    "**/tests/**",
    # Granian CLI passthrough entrypoint; exercised by process smoke tests only.
    "apps/backend/src/goalx_backend/server.py",
    # Prefect/CLI 入口式编排层；服务层承载逻辑并有单测，入口由手工冒烟覆盖。
    "apps/backend/src/goalx_backend/flows.py",
    "apps/backend/src/goalx_backend/schedules.py",
    "apps/backend/src/goalx_backend/cli.py",
    "apps/backend/src/goalx_backend/tasks.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "@overload",
    "class .*\\bProtocol\\):",
]
fail_under = 90
partial_branches = ["pragma: no branch", "if TYPE_CHECKING:"]

[tool.coverage.html]
directory = "htmlcov"

# ===================================================================
# Commitizen 配置
# ===================================================================
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_incremental = true
