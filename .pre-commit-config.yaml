# .pre-commit-config.yaml (Local Mode)
#
# 设计原则（沿用 ditto）：
# - 所有 Python 工具使用 local 模式，通过 uv run --no-sync 调用
# - 确保 pre-commit、CI、开发环境使用完全相同的工具版本
# - basedpyright 放在 CI 中运行（避免 pre-commit 隔离环境的依赖问题）
#
# 安装: task pre-commit-install

minimum_pre_commit_version: "2.20.0"
default_stages: [pre-commit]

repos:
  # ==========================================================
  # 基础检查（纯文件检查，无需 Python 环境）
  # ==========================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  # ==========================================================
  # Python 工具 - Local 模式
  # ==========================================================
  - repo: local
    hooks:
      # Ruff Lint Fix（先修复）
      - id: ruff-lint-fix
        name: ruff lint (fix)
        entry: uv run --no-sync ruff check --fix
        language: system
        types: [python]
        require_serial: false

      # Ruff Format（再格式化）
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]
        require_serial: false

      # --------------------------------------------------------
      # pytest (pre-push 阶段)
      # 输出经 scripts/pre_push_pytest.sh 落盘+失败时有界回放（票 36）：
      # pre-commit 对 hook 捕获输出做单次整体重放；log_cli=true 使满量
      # xdist 的逐用例行不受 -q 压制（~360KB），慢排水/非阻塞 push 管道下
      # 单次大写触发 BlockingIOError 自崩。回放字节必须 <64KB 管道容量。
      # 退出码原样透传。
      # --------------------------------------------------------
      - id: pytest-fast
        name: backend fast tests
        entry: scripts/pre_push_pytest.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # ==========================================================
  # 敏感信息检测
  # ==========================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # ==========================================================
  # Commit Message 规范
  # ==========================================================
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert

# ==========================================================
# 全局排除
# ==========================================================
exclude: |
  (?x)^(
    __pycache__/|
    \.pytest_cache/|
    \.ruff_cache/|
    htmlcov/|
    build/|
    dist/|
    \.venv/|
    node_modules/|
    apps/web/src/api/generated/|
    apps/web/coverage/|
    apps/web/test-results/|
    apps/web/playwright-report/|
    \.scratch/
  )$
