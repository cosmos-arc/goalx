[project]
name = "goalx-backend"
requires-python = ">= 3.13"
version = "0.1.0"
dependencies = [
    "ag-ui-protocol>=1.0,<2",
    "fastapi>=0.115,<0.137",
    "granian>=2.0,<3",
    "httpx>=0.28,<1",
    "limits>=5.8.0",
    "loguru>=0.7,<1",
    "openai-agents>=0.22.3",
    "penaltyblog>=1.6.2",
    "prefect>=3.4,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.10,<3",
    "scipy>=1.18.1",
    "tenacity>=9.1.4",
]

[project.scripts]
server = "goalx_backend.server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
goalx_backend = ["py.typed"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
]
