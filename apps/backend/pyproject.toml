[project]
name = "goalx-backend"
requires-python = ">= 3.13"
version = "0.1.0"
dependencies = [
    "fastapi>=0.115,<0.137",
    "granian>=2.0,<3",
    "loguru>=0.7,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.10,<3",
]

[project.scripts]
server = "goalx_backend.server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
goalx_backend = ["py.typed"]
